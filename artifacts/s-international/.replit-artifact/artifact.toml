kind = "web"
previewPath = "/"
title = "S International Travel"
version = "1.0.0"
id = "artifacts/s-international"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24330

[services.development]
run = "pnpm --filter @workspace/s-international run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/s-international", "run", "build" ]
publicDir = "artifacts/s-international/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24330"
BASE_PATH = "/"
